
# ======================================================================
# APP
# ======================================================================
spring.application.name=Yago_42386
server.port=8080

# ======================================================================
# DATASOURCE H2 (persistente em arquivo local)
# IMPORTANTE:
# - INIT cria o schema APP se n\u00e3o existir e muda para ele
# - AUTO_SERVER=TRUE permite acesso concorrente (console + app)
# ======================================================================
spring.datasource.url=jdbc:h2:file:./database/RH;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================================================================
# H2 CONSOLE
# ======================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ======================================================================
# JPA / HIBERNATE
# ======================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# agora sim, schema default = APP
spring.jpa.properties.hibernate.default_schema=APP
# em H2 o schema \u00e9 CASE-SENSITIVE l\u00f3gico, ent\u00e3o uso APP mai\u00fasculo

# logs de sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ======================================================================
# LOG EXTRA
# ======================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ======================================================================
# UTF-8
# ======================================================================
spring.output.ansi.enabled=ALWAYS
spring.messages.encoding=UTF-8

# ======================================================================
# INICIALIZAÇÃO COM DADOS REAIS DO XLSX (data.sql)
# ======================================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true
